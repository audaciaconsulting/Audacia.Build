# Task to publish a path as an artifact
parameters:
  - name: path
    default: ''
  - name: artifactName
    default: '$(Build.DefinitionName)'
  - name: displayName
    default: 'Artifact Publish'
  - name: alwaysPublish             # OPTIONAL: Publish the artifact even when the build was triggered by a pull request
    type: boolean
    default: false

steps:
  - task: PublishBuildArtifacts@1
    displayName: ${{parameters.displayName}}
    inputs:
      PathtoPublish: '$(build.ArtifactStagingDirectory)/${{parameters.path}}'
      ArtifactName: ${{parameters.artifactName}}
    condition: and(succeeded(), or(not(eq(variables['Build.Reason'], 'PullRequest')), eq('${{parameters.alwaysPublish}}', true)))
